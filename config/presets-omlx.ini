version = 1

# oMLX per-request sampling overrides for benchmark_omlx_reviews.py.
# Keys map to oMLX ChatCompletionRequest fields:
#   temp -> temperature, top-p -> top_p, top-k -> top_k, min-p -> min_p,
#   repeat-penalty -> repetition_penalty, repeat-context-size,
#   presence-penalty, frequency-penalty, max-tokens, thinking-budget,
#   reasoning-effort, enable-thinking, seed, xtc-probability, xtc-threshold,
#   specprefill, specprefill-keep-pct, specprefill-threshold.
#
# Models listed as "model:profile" aliases use the server-side oMLX profile
# sampling; no temperature is sent for them unless an entry here overrides it.
#
# enable-thinking entries only matter for OMLX_THINKING=0 runs, where
# response_format is active: oMLX returns empty arrays when thinking meets
# a constrained grammar, so leave it unset or false there.

[Ornith-1.5-35B-A3B-MLX-4bit]
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
repeat-penalty = 1.0

[Tiel-Coder-35B-A3B-MLX-oQ4e-MTP]
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
repeat-penalty = 1.0

[gemma-4-26B-A4B-it-QAT-MLX-4bit]
temp = 0.8
top-p = 0.95
top-k = 64
min-p = 0.05
repeat-penalty = 1.05

[Qwen3.6-35B-A3B-Claude-4.7-Opus-Reasoning-Distilled-MLX-oQ4-MTP]
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
repeat-penalty = 1.0

# Bonsai's chat template leaks reasoning into `content` under its default
# xhigh reasoning effort (and under low); medium is the only level verified to
# emit a proper think channel plus clean JSON content. Medium-effort reasoning
# is verbose, so this model also gets a larger output budget — 1024 tokens
# truncates 100% of its C++ responses before the findings array.
[Ternary-Bonsai-2-27B-MLX-4bit:bonsai2-coder]
reasoning-effort = medium
max-tokens = 4096
