version = 1

# Client-side "coder" profile — identical injected regime for the
# three-model comparison set in config/models-omlx-trio.json.
# Thinking is ON for all three at the uniform 4096 budget used by the
# six-model coder file; gemma-4-31b has a working thinking channel on oMLX.
# Inject with: --presets config/presets-omlx-trio-coder.ini

[Ternary-Bonsai-2-27B-MLX-4bit]
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
repeat-penalty = 1.0
enable-thinking = true
thinking-budget = 4096
reasoning-effort = medium
# medium effort is required regardless — it fixes the content-channel leak
max-tokens = 4096

[gemma-4-31b-it-4bit]
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
repeat-penalty = 1.0
enable-thinking = true
thinking-budget = 4096
max-tokens = 4096

