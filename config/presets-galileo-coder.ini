version = 1

# Client-side "coder" profile for Galileo — UNIFORM decoding regime injected
# per-request so cross-model comparisons hold sampling constant instead of
# inheriting the router alias's operator tuning. (max-tokens 8192 is a uniform
# cap; non-thinking models simply never reach it.)
# Inject with: --presets config/presets-galileo-coder.ini
# Section names must match a model alias from config/models.json (case-insensitive).
# Only request-level keys are injectable (temp/top-p/top-k/min-p/penalties,
# max-tokens, thinking-budget, enable-thinking); ctx-size/threads/etc. stay
# server-side. llama.cpp counts reasoning tokens against n_predict, so
# thinking entries carry max-tokens > thinking-budget.

[coder-ornith:LATEST]
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.05
repeat-penalty = 1.0
enable-thinking = true
# uniform thinking budget across thinking-capable models
thinking-budget = 4096
# soft hint to reason briefly — the template translates it; drop to `low` for
# more aggressive trimming at some recall risk
reasoning-effort = medium
# 4096 thinking + 4096 answer headroom (llama.cpp counts both against the cap)
max-tokens = 8192

[coder-qwen3.6-35b-mtp:LATEST]
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.05
repeat-penalty = 1.0
enable-thinking = true
thinking-budget = 4096
reasoning-effort = medium
max-tokens = 8192

[coder-gemma4-26B-A4B-it:LATEST]
# exception: keeps its tuned coder regime — cooling toward the uniform 0.6
# previously caused termination issues. enable-thinking=false is explicit
# documentation only: this GGUF's template ignores the flag on llama.cpp
# (published run emitted 0 reasoning chars with it on). The oMLX MLX
# template DOES emit a reasoning-channel output for this model.
temp = 0.8
top-p = 0.95
top-k = 64
min-p = 0.05
repeat-penalty = 1.05
enable-thinking = false
max-tokens = 8192

# Thinking support is now empirically resolved from the reasoning channel of
# the 2026-09-22 coder run: laguna and north-mini DO emit reasoning (they ran
# on the runner default 256 budget), gemma and qwen3-coder-next emit none —
# their templates ignore the flag on llama.cpp.

[coder-laguna-xs-2.1:LATEST]
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.05
repeat-penalty = 1.0
enable-thinking = true
thinking-budget = 4096
reasoning-effort = medium
max-tokens = 8192

[coder-north-mini-code-1.0:LATEST]
# server alias is tuned near-greedy (temp 0.2) — uniform 0.6 is a deliberate
# deviation; flag degradation as profile sensitivity, not model capability
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.05
repeat-penalty = 1.0
enable-thinking = true
thinking-budget = 4096
reasoning-effort = medium
max-tokens = 8192

[coder-qwen3-coder-next:LATEST]
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.05
repeat-penalty = 1.0
# template ignores enable_thinking on llama.cpp — explicit documentation only
enable-thinking = false
