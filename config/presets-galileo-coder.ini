version = 1

# Client-side "coder" profile for Galileo — replicates each alias's server-side
# sampling from presets.ini as explicit per-request overrides, so the measured
# regime is pinned in the request payload rather than inherited from the router.
# Inject with: --presets config/presets-galileo-coder.ini
# Section names must match a model alias from config/models.json (case-insensitive).
# Only request-level keys are injectable (temp/top-p/top-k/min-p/penalties,
# max-tokens, thinking-budget, enable-thinking); ctx-size/threads/etc. stay
# server-side. llama.cpp counts reasoning tokens against n_predict, so
# thinking entries carry max-tokens > thinking-budget.

[coder-ornith:LATEST]
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
repeat-penalty = 1.0
enable-thinking = true
# uniform thinking budget across thinking-capable models
thinking-budget = 4096
# 4096 thinking + 4096 answer headroom (llama.cpp counts both against the cap)
max-tokens = 8192

[coder-qwen3.6-35b-mtp:LATEST]
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
repeat-penalty = 1.05
enable-thinking = true
thinking-budget = 4096
max-tokens = 8192

[coder-gemma4-26B-A4B-it:LATEST]
temp = 0.8
top-p = 0.95
top-k = 64
min-p = 0.05
repeat-penalty = 1.05
# no thinking channel
enable-thinking = false
max-tokens = 4096

# Thinking support unverified for the three coder-distillations below — the
# server alias default applies. Add enable-thinking once confirmed against
# the model's chat template.

