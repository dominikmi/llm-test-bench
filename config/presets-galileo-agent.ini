version = 1

# Client-side "agentic" profile for Galileo — per-request sampling overrides
# that beat the router alias defaults baked into presets.ini server-side.
# Inject with: --presets config/presets-galileo-agent.ini
# Section names must match a model alias from config/models.json (case-insensitive).
# Design: where a thinking channel exists, enable it with a larger budget and
# slightly more diverse sampling; where it does not, tighten sampling and keep
# headroom. Only the keys in PRESET_SAMPLING_KEYS are client-injectable —
# ctx-size, cache types, GPU layers stay server-side.

[coder-ornith:LATEST]
temp = 0.7
top-p = 0.95
top-k = 40
min-p = 0.05
repeat-penalty = 1.0
enable-thinking = true
# 32x the runner default (256) — bounded thinking for multi-step reasoning
thinking-budget = 8192
# llama.cpp counts reasoning tokens against n_predict: max-tokens must exceed
# thinking-budget or the answer is starved (empty content after cap)
max-tokens = 12288

[coder-qwen3.6-35b-mtp:LATEST]
temp = 0.7
top-p = 0.95
top-k = 40
min-p = 0.05
repeat-penalty = 1.0
enable-thinking = true
thinking-budget = 8192
max-tokens = 12288

[coder-gemma4-26B-A4B-it:LATEST]
temp = 0.7
top-p = 0.95
# tighter top_k than the coder alias (64->40) curbs rambling.
# enable-thinking=false is explicit documentation only: this GGUF's template
# ignores the flag on llama.cpp (0 reasoning chars with it on in the
# published run). The oMLX MLX template DOES emit reasoning-channel output.
top-k = 40
min-p = 0.05
repeat-penalty = 1.0
enable-thinking = false
max-tokens = 4096

# Thinking support unverified for the three coder-distillations below — the
# server alias default applies. Add enable-thinking once confirmed against
# the model's chat template.

