version = 1

# Client-side "agentic" profile — identical injected regime for the
# three-model comparison set in config/models-omlx-trio.json.
# Thinking is ON for all three; gemma-4-31b emits reasoning_content on
# oMLX (verified against the live server), so it is enabled here for parity.
# Inject with: --presets config/presets-omlx-trio-agent.ini

[Ternary-Bonsai-2-27B-MLX-4bit]
temp = 0.7
top-p = 0.95
top-k = 40
min-p = 0.05
repeat-penalty = 1.0
enable-thinking = true
thinking-budget = 8192
reasoning-effort = medium
# medium effort is required regardless — it fixes the content-channel leak
max-tokens = 4096

[gemma-4-31b-it-4bit]
temp = 0.7
top-p = 0.95
top-k = 40
min-p = 0.05
repeat-penalty = 1.0
enable-thinking = true
thinking-budget = 8192
max-tokens = 4096

[Qwen3.8-27B-MLX-4bit]
temp = 0.7
top-p = 0.95
top-k = 40
min-p = 0.05
repeat-penalty = 1.0
enable-thinking = true
