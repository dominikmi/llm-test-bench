version = 1

# Client-side "agentic" profile — per-request overrides for tool-use and
# multi-step reasoning workloads. Inject with: --presets config/presets-omlx-agent.ini
# Design: where a thinking channel exists, enable it with a larger budget and
# slightly more diverse sampling (mirroring the bonsai2-agent server profile);
# where it does not (Gemma, Devstral), tighten sampling and keep headroom.

[Ornith-1.5-35B-A3B-MLX-4bit]
temp = 0.7
top-p = 0.95
top-k = 40
min-p = 0.05
repeat-penalty = 1.0
enable-thinking = true
thinking-budget = 8192
# bounds what was previously unbounded thinking (run-1 truncation cause)
max-tokens = 4096

[Tiel-Coder-35B-A3B-MLX-oQ4e-MTP]
temp = 0.7
top-p = 0.95
top-k = 40
min-p = 0.05
repeat-penalty = 1.0
enable-thinking = true
thinking-budget = 8192
max-tokens = 4096

[gemma-4-26B-A4B-it-QAT-MLX-4bit]
temp = 0.7
top-p = 0.95
top-k = 40
min-p = 0.05
repeat-penalty = 1.0
enable-thinking = false
# thinking unsupported — tighter top_k vs coder (64->40) to curb rambling
max-tokens = 4096

[Qwen3.6-35B-A3B-Claude-4.7-Opus-Reasoning-Distilled-MLX-oQ4-MTP]
temp = 0.7
top-p = 0.95
top-k = 40
min-p = 0.05
repeat-penalty = 1.0
enable-thinking = true
thinking-budget = 8192
max-tokens = 4096

[Devstral-Small-2-24B-Instruct-2512-6bit:devstral-code]
temp = 0.3
top-p = 0.95
top-k = 20
min-p = 0.05
repeat-penalty = 1.0
enable-thinking = false
# no thinking channel — modest diversity raise from near-greedy 0.15
max-tokens = 4096

[Ternary-Bonsai-2-27B-MLX-4bit:bonsai2-coder]
temp = 0.7
top-p = 0.95
top-k = 40
min-p = 0.05
repeat-penalty = 1.0
enable-thinking = true
thinking-budget = 16384
reasoning-effort = medium
# medium effort is required regardless — it fixes the content-channel leak
max-tokens = 4096
